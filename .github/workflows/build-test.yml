name: Build-and-test

on: [push, pull_request]

jobs:
  test:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: xcodebuild test -project MTMR.xcodeproj -scheme 'UnitTests' -quiet

  build:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (universal binary)
        run: xcodebuild archive -project "MTMR.xcodeproj" -scheme "MTMR" -archivePath Release/App.xcarchive DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" ARCHS="arm64 x86_64" -quiet

      - name: Verify universal binary
        run: lipo -info Release/App.xcarchive/Products/Applications/MTMR.app/Contents/MacOS/MTMR
